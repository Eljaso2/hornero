<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: Hornero green -->
  <rect width="512" height="512" rx="96" fill="#6E8345"/>

  <!-- Feather stylized -->
  <g transform="translate(256,256) scale(1.4)" fill="#F2F1EC" stroke="none">
    <!-- Central shaft -->
    <path d="M0,-120 L0,120" stroke="#F2F1EC" stroke-width="5" fill="none"/>
    <!-- Left vane -->
    <path d="M0,-120 Q-60,-80 -50,-40 Q-40,0 -45,40 Q-50,70 -30,100 L0,120 Z" fill="#F2F1EC" opacity="0.9"/>
    <!-- Right vane -->
    <path d="M0,-120 Q60,-80 50,-40 Q40,0 45,40 Q50,70 30,100 L0,120 Z" fill="#F2F1EC" opacity="0.7"/>
    <!-- Barbs left -->
    <line x1="0" y1="-90" x2="-55" y2="-70" stroke="#94A867" stroke-width="1.5"/>
    <line x1="0" y1="-60" x2="-48" y2="-35" stroke="#94A867" stroke-width="1.5"/>
    <line x1="0" y1="-30" x2="-42" y2="0" stroke="#94A867" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="-40" y2="30" stroke="#94A867" stroke-width="1.5"/>
    <line x1="0" y1="30" x2="-35" y2="60" stroke="#94A867" stroke-width="1.5"/>
    <line x1="0" y1="60" x2="-20" y2="85" stroke="#94A867" stroke-width="1.5"/>
    <!-- Barbs right -->
    <line x1="0" y1="-90" x2="55" y2="-70" stroke="#94A867" stroke-width="1.5"/>
    <line x1="0" y1="-60" x2="48" y2="-35" stroke="#94A867" stroke-width="1.5"/>
    <line x1="0" y1="-30" x2="42" y2="0" stroke="#94A867" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="40" y2="30" stroke="#94A867" stroke-width="1.5"/>
    <line x1="0" y1="30" x2="35" y2="60" stroke="#94A867" stroke-width="1.5"/>
    <line x1="0" y1="60" x2="20" y2="85" stroke="#94A867" stroke-width="1.5"/>
  </g>

  <!-- Tagline -->
  <text x="256" y="420" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="36" fill="#F2F1EC" letter-spacing="4">HORNERO</text>
</svg>
