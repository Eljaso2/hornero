<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">  <title>Hornero</title>
  <meta name="description" content="Asistente IA sindical para trabajadores argentinos">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="assets/hornero-logo-192.png" type="image/png">
  <!-- theme-color: single meta, JS recreates on toggle to force browser repaint -->
  <meta name="theme-color" content="#1E2321">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hornero">
  <link rel="apple-touch-icon" href="assets/hornero-logo-192.png">

  <!-- Set theme colors IMMEDIATELY based on session + theme — zero flash of wrong color -->
  <script>
    (function(){
      var s=null;
      try{s=JSON.parse(localStorage.getItem('hornero-session'))}catch(e){}
      var t=localStorage.getItem('hornero-theme')||'dark';
      // Login is ALWAYS dark; only logged-in users see light mode
      var c=(s&&t==='light')?'#F8F6F0':'#1E2321';
      document.documentElement.style.setProperty('background',c,'important');
      var m=document.querySelector('meta[name="theme-color"]');
      if(m)m.setAttribute('content',c);
      var sb=document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
      if(sb)sb.setAttribute('content',(t==='light')?'default':'black');
      window._hoInitBg=c;
      window._hoInitTheme=t;
    })();
  </script>

  <!-- Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@700;800;900&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">

  <!-- Global CSS variables (used by all components) -->
  <link rel="stylesheet" href="css/hornero.css">

  <!-- Shared API utilities (wakeup + retry + URL detection) -->
  <script src="js/hornero-api.js"></script>
  <!-- Auth fetch wrapper (Bearer token + auto-refresh) -->
  <script src="js/auth-fetch.js"></script>
  <!-- IndexedDB (shared between vanilla and HoComponent) -->
  <script src="js/db.js"></script>
  <!-- Data loader (seeds IndexedDB from JSON) -->
  <script src="js/data-loader.js"></script>
  <!-- Push subscription (Web Push notifications) -->
  <script src="js/push-subscription.js"></script>
  <!-- Clipping notifier (in-app detection + badge) -->
  <script src="js/clipping-notifier.js"></script>

  <style>
    /* App-level: theme-aware (head script sets _hoInitBg) */
    html { background: var(--ho-bg, #1E2321) !important;
      background-attachment: fixed !important;
      height: 100%; height: -webkit-fill-available;
      margin: 0; padding: 0; border: none; outline: none; }
    body { background: var(--ho-bg, #1E2321) !important;
      background-attachment: fixed !important;
      overscroll-behavior: none; overflow: hidden;
      margin: 0; padding: 0; height: 100%;
      border: none; outline: none; }
    /* Desktop: allow page scroll so phone frame is fully visible in short viewports */
    @media(min-width:500px) {
      html { height: auto; }
      body { overflow-y: auto; height: auto; }
      hornero-app { height: auto; }
    }
    hornero-app { display: block; width: 100%; height: 100%;
      height: -webkit-fill-available; }
    /* PWA install banner */
    .pwa-install-banner { position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--ho-dark, #1E2321); color: var(--ho-text-off, #F2F1EC);
      padding: 14px 16px 20px; display: flex; align-items: center; gap: 12px;
      z-index: 200; font-family: 'Archivo', sans-serif;
      box-shadow: 0 -4px 16px rgba(0,0,0,.15); transition: transform .3s; }
    .pwa-install-banner.hidden { transform: translateY(100%); }
    .pwa-install-banner .banner-icon { width: 48px; height: 48px;
      border-radius: 12px; background: var(--ho-green, #4E9978);
      display: flex; align-items: center; justify-content: center; }
    .pwa-install-banner .banner-text { flex: 1; }
    .pwa-install-banner .banner-title { font-weight: 700; font-size: .92rem; }
    .pwa-install-banner .banner-desc { font-size: .78rem; color: #9C988D; margin-top: 2px; }
    .pwa-install-btn { background: var(--ho-green, #4E9978); color: var(--ho-text-off, #F2F1EC);
      border: none; border-radius: 8px; padding: 10px 18px; font-family: 'Archivo', sans-serif;
      font-weight: 700; font-size: .82rem; cursor: pointer; }
    .pwa-install-dismiss { background: none; border: none; color: #9C988D;
      font-size: .82rem; cursor: pointer; padding: 10px 8px; }
  </style>
</head>
<!-- Set body bg immediately — uses color from head script -->
<body>
<script>document.body.style.setProperty('background',window._hoInitBg||'#1E2321','important');</script>
  <!-- HoComponent app shell — Shadow DOM renders instantly via sync session -->
  <hornero-app></hornero-app>

  <!-- PWA install banner (shown when browser supports install) -->
  <div class="pwa-install-banner hidden" id="pwaBanner">
    <div class="banner-icon"><img src="assets/hornero-logo-192.png" width="36" height="36" alt="Hornero" style="border-radius:50%;object-fit:cover"></div>
    <div class="banner-text">
      <div class="banner-title">Instalar Hornero</div>
      <div class="banner-desc">Abrir como app — sin barra de navegador</div>
    </div>
    <button class="pwa-install-btn" id="pwaInstallBtn">Instalar</button>
    <button class="pwa-install-dismiss" id="pwaDismissBtn">✕</button>
  </div>

  <!-- Init: IndexedDB → seed data → register SW → PWA install -->
  <script>
    initDB()
      .then(function() { return cleanOldSimulationData(); })
      .then(function() { return limpiarChatsYReportes(); })
      .then(function() { return loadAllData(); })
      .then(function(results) {
        // Seed all piloto data found (aceitero + sector-specific)
        var seeds = [];
        for (var key in results) {
          if (key && key.startsWith('is-piloto-') && results[key]) {
            seeds.push(seedData(results[key]));
          }
        }
        return Promise.all(seeds);
      })
      .then(function() {
        // Start clipping notification polling + push subscription
        if (typeof initClippingNotifier === 'function') {
          initClippingNotifier();
        }
        if (typeof initPushSubscription === 'function') {
          initPushSubscription();
        }
      })
      .catch(function(err) {
        console.warn('Init error (app still works):', err);
      });

    // Register service worker — check for updates every 5 min
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js', { scope: './', updateViaCache: 'none' })
        .then(function(reg) {
          console.log('SW registered:', reg.scope);
          // Check for updates periodically (every 5 minutes)
          setInterval(function() { reg.update(); }, 300000);
        })
        .catch(function(err) {
          console.warn('SW registration failed:', err);
        });

      // Listen for SW update messages — show update banner (user decides when to reload)
      navigator.serviceWorker.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'SW_UPDATE_AVAILABLE') {
          var app = document.querySelector('hornero-app');
          if (app) app.set('updateAvailable', true);
        }
      });
    }

    // PWA install prompt — capture beforeinstallprompt and show custom banner
    var deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      // Show custom install banner
      document.getElementById('pwaBanner').classList.remove('hidden');
      console.log('beforeinstallprompt captured — install banner shown');
    });

    document.getElementById('pwaInstallBtn').addEventListener('click', function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choiceResult) {
          if (choiceResult.outcome === 'accepted') {
            console.log('PWA installed');
          }
          deferredPrompt = null;
          document.getElementById('pwaBanner').classList.add('hidden');
        });
      }
    });

    document.getElementById('pwaDismissBtn').addEventListener('click', function() {
      document.getElementById('pwaBanner').classList.add('hidden');
    });

    // If app is already installed, never show banner
    window.addEventListener('appinstalled', function() {
      document.getElementById('pwaBanner').classList.add('hidden');
    });
  </script>

  <!-- Load HoComponent Web Components (ES module) — cache-bust via query param -->
  <script type="module" src="lit/hornero-components.js?ver=689"></script>
</body>
</html>
