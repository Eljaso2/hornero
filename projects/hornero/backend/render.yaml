services:
  - type: web
    name: hornero-ia
    runtime: python
    rootDir: projects/hornero/backend
    buildCommand: apt-get update && apt-get install -y ffmpeg && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false  # Set manually in Render dashboard — DashScope key for LLM
      - key: DEEPSEEK_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      - key: DEEPSEEK_MODEL
        value: glm-5.1
      - key: DASHSCOPE_API_KEY
        sync: false  # DashScope key for STT auth — can be same as DEEPSEEK_API_KEY
      - key: DASHSCOPE_STT_MODEL
        value: paraformer-v2
      - key: DASHSCOPE_STT_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1/audio/transcriptions
      - key: ALLOWED_ORIGIN
        value: https://eljaso2.github.io
      - key: APP_BACKEND_URL
        fromService:
          name: hornero-ia
          type: web
          property: hostUrl
